services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: wellbeing
      POSTGRES_USER: wellbeing
      POSTGRES_PASSWORD: wellbeing-local
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellbeing"]
      interval: 5s
      retries: 10

  api:
    build: ./Backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://wellbeing:wellbeing-local@db:5432/wellbeing
      JWT_SECRET: wellbeing-local-secret
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      NOTIFICATION_MODE: log
      ARIA_ENABLED: "false"
    volumes:
      - api-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  api-uploads:
